kind = "api"
previewPath = "/api"
title = "WaitLess API (Spring Boot)"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "cd /home/runner/workspace/artifacts/spring-api && mvn spring-boot:run -Dspring-boot.run.jvmArguments='-Xmx384m'"

[services.production]

[services.production.build]
args = ["sh", "-c", "cd /home/runner/workspace/artifacts/spring-api && mvn package -DskipTests -q"]

[services.production.run]
args = ["java", "-jar", "/home/runner/workspace/artifacts/spring-api/target/waitless-api-0.0.1-SNAPSHOT.jar"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/organizations"
